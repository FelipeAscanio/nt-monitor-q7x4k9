# Configuración del monitor.
# Para pausar un producto sin borrarlo: activo: false

zona_horaria: America/Chicago

# Ventanas de vigilancia intensiva (cada ~20-30 s) por tienda.
#   dias: lun, mar, mie, jue, vie, sab, dom
#   desde / hasta: hora local en formato 24 h (HH:MM)
#   cada_segundos: cada cuánto revisar dentro de la ventana
#   fuera_de_ventana: normal (revisa cada ~5 min) | nada (no revisa)
# Las tiendas sin ventana se revisan cada ~5 min todo el día.
ventanas:
  target:
    dias: [mar, mie, jue, vie]
    desde: "02:00"
    hasta: "04:00"
    cada_segundos: 25
    fuera_de_ventana: normal

  walmart:
    dias: [mie]
    desde: "19:59"
    hasta: "21:00"
    cada_segundos: 25
    fuera_de_ventana: normal

# Productos a vigilar.
#   nombre          Cómo aparecerá en la notificación
#   tienda          bestbuy | walmart | target | amazon | generico
#   url             Página del producto (al tocar la alerta se abre aquí)
#   sku             Solo Best Buy: número "SKU" de la página del producto
#   precio_maximo   (opcional) No alerta si el precio es mayor (contra revendedores)
#
# Los de abajo son EJEMPLOS desactivados: reemplázalos por los reales.
productos:
  - nombre: "30th Celebration Ultra Premium Collection (Night)"
    tienda: target
    url: "https://www.target.com/p/pok-233-mon-trading-card-game-30th-celebration-ultra-premium-collection-night/-/A-1012850572"
    activo: true

  - nombre: "Booster Bundle (ejemplo Walmart)"
    tienda: walmart
    url: "https://www.walmart.com/ip/000000000"
    precio_maximo: 35
    activo: false

  - nombre: "Elite Trainer Box (ejemplo Best Buy)"
    tienda: bestbuy
    sku: "0000000"
    url: "https://www.bestbuy.com/site/0000000.p?skuId=0000000"
    precio_maximo: 60
    activo: false

  - nombre: "Elite Trainer Box (ejemplo Amazon)"
    tienda: amazon
    url: "https://www.amazon.com/dp/B000000000"
    precio_maximo: 60
    activo: false
